name: Tests

on: push

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5.0.0
    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version-file: pyproject.toml
        architecture: x64
        cache: pip
    - name: Set up uv
      uses: astral-sh/setup-uv@v6.7.0
      with:
        version-file: "pyproject.toml"
    - name: Install dependencies
      run: uv pip install -r pylock.toml
    - name: Run pytest
      run: pytest

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5.0.0
    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version-file: pyproject.toml
        architecture: x64
        cache: pip
    - name: Set up uv
      uses: astral-sh/setup-uv@v6.7.0
      with:
        version-file: "pyproject.toml"
    - name: Install dependencies
      run: uv pip install -r pylock.toml
    - name: Run mypy
      run: mypy

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5.0.0
    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version-file: pyproject.toml
        architecture: x64
        cache: pip
    - name: Set up uv
      uses: astral-sh/setup-uv@v6.7.0
      with:
        version-file: "pyproject.toml"
    - name: Install dependencies
      run: uv pip install -r pylock.toml
    - name: Run Ruff
      run: ruff check

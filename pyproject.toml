[project]
name = "Harmonbot"
dynamic = ["version"]
requires-python = "==3.11.*"

[build-system]
requires = ["setuptools==80.9.0", "setuptools-scm==9.2.0"]
build-backend = "setuptools.build_meta"

[tool.bandit.assert_used]
skips = ["tests/*.py"]

[tool.mypy]
packages = ["units"]
python_version = "3.11"

[tool.ruff]
include = ["tests/*.py", "units/*.py"]

[tool.ruff.lint]
ignore = [
    "E501",  # line-too-long
    "TD002",  # missing-todo-author
    "TD003",  # missing-todo-link
    "UP015",  # redundant-open-modes
]
select = [
    "E",  # pycodestyle error
    "EXE",  # flake8-executable
    "F",  # Pyflakes
    "FA",  # flake8-future-annotations
    "FURB",  # refurb
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PLE",  # Pylint Error
    "PYI",  # flake8-pyi
    "RSE",  # flake8-raise
    "S",  # flake8-bandit
    "SLOT",  # flake8-slots
    "TC",  # flake8-type-checking
    "TD",  # flake8-todos
    "UP",  # pyupgrade
    "YTT",  # flake8-2020
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]  # assert

[tool.setuptools]
packages = ["units"]

[tool.setuptools_scm]

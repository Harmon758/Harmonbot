# Change pip's cache directory to be inside
# the project directory since we can only cache local items.
# https://gitlab.com/gitlab-org/gitlab/-/issues/14151
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POSTGRES_HOST: postgres
  POSTGRES_DB: harmonbot
  POSTGRES_USER: harmonbot
  POSTGRES_PASSWORD: ""
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  # https://docs.astral.sh/uv/guides/integration/gitlab/
  UV_LINK_MODE: copy

Discord:
  # Official language image. Look for the different tagged releases at:
  # https://hub.docker.com/r/library/python/tags/
  image: python:3.11.7
  services:
    - postgres:12.1
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .cache/pip
        - .uv-cache
  script:
    - pip install --upgrade uv
    - uv pip install -r pylock.toml --system
    - cd Discord
    - python -u Harmonbot.py
    - uv cache prune --ci

Telegram:
  # Official language image. Look for the different tagged releases at:
  # https://hub.docker.com/r/library/python/tags/
  image: python:3.11.7
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .cache/pip
        - .uv-cache
  script:
    - pip install --upgrade uv
    - uv pip install -r pylock.toml --system
    - cd Telegram
    - python Telegram_Harmonbot.py
    - uv cache prune --ci

Discord Listener:
  variables:
    REPO_NAME: github.com/harmon758/harmonbot
  image: golang:1.20.9
  # The problem is that to be able to use go get, one needs to put
  # the repository in the $GOPATH. So for example, if your gitlab domain
  # is gitlab.com, and your repository is namespace/project, and with
  # the default GOPATH being /go, then you'd need to have your
  # repository in /go/src/gitlab.com/namespace/project
  # Thus, making a symbolic link corrects this.
  before_script:
    - mkdir -p $GOPATH/src/$(dirname $REPO_NAME)
    - ln -svf $CI_PROJECT_DIR $GOPATH/src/$REPO_NAME
    - cd $GOPATH/src/$REPO_NAME
    - go get github.com/bwmarrin/discordgo
    - go get github.com/bwmarrin/dgvoice
    - go get github.com/joho/godotenv
    - cd Discord
  script:
    - go run Harmonbot_Listener.go
